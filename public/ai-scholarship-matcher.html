<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scholarship Matcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --input-bg: #f8fafc;
            --shadow: rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #111827 0%, #1f2937 100%);
            --card-bg: #1f2937;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --border: #475569;
            --input-bg: #111827;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
            margin-bottom: 18px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 16px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background: var(--input-bg);
            color: var(--text-main);
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .file-drop {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: var(--input-bg);
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-drop:hover {
            border-color: var(--primary);
        }

        .file-drop input {
            display: none;
        }

        .file-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .file-label span {
            color: var(--primary);
            font-weight: 600;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        /* Loading Spinner State */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-top: 0;
            color: var(--text-muted);
            font-size: 0.875rem;
            line-height: 1.5;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            margin: 0 4px;
        }

        .footer a:hover {
            text-decoration: underline;
        }
        
        button#theme-toggle {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            background: color-mix(in srgb, var(--input-bg) 82%, transparent);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 0;
            border-radius: 50%;
            font-size: 1rem;
            line-height: 1;
            margin: 0;
            box-shadow: 0 4px 12px var(--shadow);
            backdrop-filter: blur(8px);
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }

        button#theme-toggle:hover {
            background-color: var(--border);
            border-color: var(--primary);
            box-shadow: 0 6px 16px var(--shadow);
            transform: translateY(-2px);
        }

        button#theme-toggle:focus-visible {
            outline: 3px solid rgba(99, 102, 241, 0.35);
            outline-offset: 3px;
        }

        .theme-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 2;
            transition: transform 0.25s ease;
        }

        button#theme-toggle:hover .theme-icon {
            transform: rotate(12deg);
        }

        .sun-icon {
            display: none;
        }

        [data-theme="dark"] .moon-icon {
            display: none;
        }

        [data-theme="dark"] .sun-icon {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AI Scholarship Matcher</h1>
            <p>Upload your resume and details to find tailored scholarship grants</p>
            <button id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme">
                <svg class="theme-icon moon-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
                </svg>
                <svg class="theme-icon sun-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"></circle>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"></path>
                </svg>
            </button>
        </div>

        <form id="scholarshipForm" action="http://localhost:3000/match-scholarships" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="major">Major / Field of Study</label>
                <input type="text" id="major" name="major" required placeholder="e.g., Computer Science">
            </div>
            
            <div class="form-group">
                <label for="country">Country of Study / Residence</label>
                <input type="text" id="country" name="country" required placeholder="e.g., Greece">
            </div>

            <div class="form-group">
                <label for="gpa">Current GPA (Average grade out of 5.0, e.g. 8.2/10 -> 4.1/5.0)</label>
                <input type="text" id="gpa" name="gpa" required placeholder="e.g., 3.8/5.0">
            </div>

            <div class="form-group">
                <label for="academicYear">Academic Year</label>
                <select id="academicYear" name="academicYear">
                    <option value="Freshman">Freshman</option>
                    <option value="Sophomore">Sophomore</option>
                    <option value="Junior">Junior</option>
                    <option value="Senior">Senior</option>
                    <option value="Graduate">Graduate</option>
                </select>
            </div>

            <div class="form-group">
                <label>Resume / CV (.pdf, .docx, .txt)</label>
                <label class="file-drop" for="resume">
                    <span class="file-label" id="fileText">Click to upload or drag & drop your resume file</span>
                    <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt,image/*">                
                </label>
            </div>

            <button type="submit" id="submitBtn">Find Scholarships</button>
        </form>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); font-weight: 500;">Analyzing your profile with AI...</p>
        </div>
    </div>
   <div class="footer">
        © 2026 Developed by Peter Sapountzis | <a href="https://github.com/Petersap4" target="_blank">GitHub</a> | <a href="https://www.linkedin.com/in/peter-sapountzis-b78270209/" target="_blank">LinkedIn</a>
    </div>

    <script>
        const toggleButton = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';

        const setTheme = (theme) => {
            const isDark = theme === 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            toggleButton.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
            toggleButton.setAttribute('title', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        };

        setTheme(currentTheme);

        toggleButton.addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', theme);
            setTheme(theme);
        });
        
        const fileInput = document.getElementById('resume');
        const fileText = document.getElementById('fileText');
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileText.innerHTML = `Selected: <strong>${e.target.files[0].name}</strong>`;
            }
        });

        const form = document.getElementById('scholarshipForm');
        const loadingOverlay = document.getElementById('loadingOverlay');

        form.addEventListener('submit', () => {
            form.style.display = 'none';
            loadingOverlay.style.display = 'block';
        });
    </script>
</body>
</html>
