<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Scholarship Matcher</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin: 0 0 8px 0;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: all 0.2s ease;
            background: #f8fafc;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .file-drop {
            border: 2px dashed var(--border);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .file-drop:hover {
            border-color: var(--primary);
        }

        .file-drop input {
            display: none;
        }

        .file-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .file-label span {
            color: var(--primary);
            font-weight: 600;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.99);
        }

        /* Loading Spinner State */
        .loading-overlay {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>AI Scholarship Matcher</h1>
            <p>Upload your resume and details to find tailored scholarship grants</p>
        </div>

        <form id="scholarshipForm" action="http://localhost:3000/match-scholarships" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="major">Major / Field of Study</label>
                <input type="text" id="major" name="major" required placeholder="e.g., Computer Science">
            </div>
            
            <div class="form-group">
                <label for="country">Country of Study / Residence</label>
                <input type="text" id="country" name="country" required placeholder="e.g., Greece">
            </div>

            <div class="form-group">
                <label for="gpa">Current GPA</label>
                <input type="text" id="gpa" name="gpa" required placeholder="e.g., 3.8">
            </div>

            <div class="form-group">
                <label for="academicYear">Academic Year</label>
                <select id="academicYear" name="academicYear">
                    <option value="Freshman">Freshman</option>
                    <option value="Sophomore">Sophomore</option>
                    <option value="Junior">Junior</option>
                    <option value="Senior">Senior</option>
                    <option value="Graduate">Graduate</option>
                </select>
            </div>

            <div class="form-group">
                <label>Resume / CV (.pdf, .docx, .txt)</label>
                <label class="file-drop" for="resume">
                    <span class="file-label" id="fileText">Click to upload or drag & drop your resume file</span>
                    <input type="file" id="resume" name="resume" accept=".pdf,.docx,.txt,image/*">                
                </label>
            </div>

            <button type="submit" id="submitBtn">Find Scholarships</button>
        </form>

        <div class="loading-overlay" id="loadingOverlay">
            <div class="spinner"></div>
            <p style="color: var(--text-muted); font-weight: 500;">Analyzing your profile with AI...</p>
        </div>
    </div>

    <script>
        // Update file label text when a file is selected
        const fileInput = document.getElementById('resume');
        const fileText = document.getElementById('fileText');
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileText.innerHTML = `Selected: <strong>${e.target.files[0].name}</strong>`;
            }
        });

        // Show loading state on submit
        const form = document.getElementById('scholarshipForm');
        const loadingOverlay = document.getElementById('loadingOverlay');

        form.addEventListener('submit', () => {
            form.style.display = 'none';
            loadingOverlay.style.display = 'block';
        });
    </script>
</body>
</html>
